name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -e
          mkdir -p dist
          # hand-written static app (no build step)
          cp -r site/. dist/
          # media library (photos, videos, resume pdf)
          mkdir -p dist/uploads dist/images
          if [ -d public/uploads ]; then cp -r public/uploads/. dist/uploads/; fi
          if [ -d public/images ]; then cp -r public/images/. dist/images/; fi
          # bypass Jekyll so every file/folder is served as-is
          touch dist/.nojekyll
          echo "--- dist ---"
          du -sh dist
          ls dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

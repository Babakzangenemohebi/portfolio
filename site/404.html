<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>صفحه پیدا نشد — بابک زنگنه محبی</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<style>
  @font-face{font-family:Vazirmatn;src:url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Variable/font-face/Vazirmatn[wght].woff2") format("woff2-variations");font-weight:100 900;font-display:swap}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#06070a;color:#eef1f6;font-family:Vazirmatn,system-ui,Tahoma,sans-serif;text-align:center;padding:24px;
       background-image:radial-gradient(600px 300px at 80% -10%,rgba(34,211,238,.22),transparent 65%),radial-gradient(500px 260px at 0% 110%,rgba(124,58,237,.2),transparent 65%)}
  .code{font-size:clamp(72px,18vw,140px);font-weight:900;line-height:1;letter-spacing:-6px;
        background:linear-gradient(120deg,#67e8f9,#22d3ee 45%,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;margin:10px 0 8px}
  p{color:#98a1b2;font-size:13.5px;margin:0 0 26px}
  a{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:14px;font-weight:700;font-size:13.5px;
    color:#04161c;background:linear-gradient(135deg,#67e8f9,#22d3ee);text-decoration:none;box-shadow:0 16px 40px -16px rgba(34,211,238,.9)}
</style>
</head>
<body>
  <div>
    <div class="code">۴۰۴</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>شاید آدرس را اشتباه وارد کرده‌اید. برگردید به پورتفولیو.</p>
    <a href="./">بازگشت به خانه</a>
  </div>
</body>
</html>
